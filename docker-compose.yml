name: gieda

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Copy .env.example to .env and set the passwords}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api-tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: src/database/api/Dockerfile.test
    working_dir: /workspace
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: test
      MYSQL_USER: test
      MYSQL_PASSWORD: test
    volumes:
      - ./src:/workspace/src

  price-history-api:
    build:
      context: ./src
      dockerfile: database/api/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Copy .env.example to .env and set the passwords}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      GROK_API_KEY: ${GROK_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      SECONDARY_LLM_API_KEY: ${SECONDARY_LLM_API_KEY:-}
      GROK_SP500_STATE_PATH: /var/lib/grok-sp500/processed.sqlite3
      GIEDA_LOG_DIRECTORY: /var/log/gieda
    volumes:
      - grok_sp500_state:/var/lib/grok-sp500
      - ./src/database/api/ai_verification_config.json:/app/ai_verification_config.json:ro
      - ./logs:/var/log/gieda
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  mysql_data:
  grok_sp500_state:
